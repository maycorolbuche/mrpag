name: Worker e autenticação
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: "CI / Validação"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  deploy:
    name: Deploy Cloudflare
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: mrpag-cloudflare-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Publicar a main no Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_APP_URL: ${{ vars.CLOUDFLARE_APP_URL }}
        run: |
          git fetch --no-tags origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "A main já tem um commit mais recente. Esta revisão não será publicada."
            exit 0
          fi
          node scripts/prepare-cloudflare-config.mjs
          npx --no-install wrangler d1 migrations apply DB --remote --config wrangler.production.generated.json
          npx --no-install wrangler deploy --config wrangler.production.generated.json
